name: 'ReleaseProof Verification'
description: 'Production-readiness verification engine for AI agents and vibe-coders.'
author: 'ReleaseProof Team'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Path to the project directory to verify'
    required: false
    default: '.'
  port:
    description: 'Port number to override or verify'
    required: false
  timeout:
    description: 'Server startup timeout in milliseconds'
    required: false
    default: '30000'
  fail-on-blocker:
    description: 'Fail the action step if verification discovers any blockers'
    required: false
    default: 'true'
  fail-on-incomplete:
    description: 'Fail the action step when required verification capability is unavailable'
    required: false
    default: 'true'
  target:
    description: 'Optional runnable target relative path inside a monorepo'
    required: false

outputs:
  score:
    description: 'Readiness score from 0 to 100'
    value: ${{ steps.releaseproof.outputs.score }}
  status:
    description: 'Verification status: READY, NOT_READY, or INCOMPLETE'
    value: ${{ steps.releaseproof.outputs.status }}
  blockers-count:
    description: 'Number of verified blockers'
    value: ${{ steps.releaseproof.outputs.blockers-count }}
  warnings-count:
    description: 'Number of warnings'
    value: ${{ steps.releaseproof.outputs.warnings-count }}
  html-report:
    description: 'Path to the generated standalone HTML report'
    value: ${{ steps.releaseproof.outputs.html-report }}
  ai-fix-prompt:
    description: 'Path to the generated AI remediation prompt'
    value: ${{ steps.releaseproof.outputs.ai-fix-prompt }}

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Build and run repository-local ReleaseProof
      id: releaseproof
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_PORT: ${{ inputs.port }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_FAIL_ON_BLOCKER: ${{ inputs.fail-on-blocker }}
        INPUT_FAIL_ON_INCOMPLETE: ${{ inputs.fail-on-incomplete }}
        INPUT_TARGET: ${{ inputs.target }}
      run: |
        set -uo pipefail
        if [[ "$INPUT_FAIL_ON_BLOCKER" != "true" && "$INPUT_FAIL_ON_BLOCKER" != "false" ]] || \
           [[ "$INPUT_FAIL_ON_INCOMPLETE" != "true" && "$INPUT_FAIL_ON_INCOMPLETE" != "false" ]]; then
          echo "fail-on-blocker and fail-on-incomplete must be true or false." >&2
          exit 3
        fi
        ARGS=(verify "$INPUT_PATH" --ci)
        if [ -n "$INPUT_PORT" ]; then
          ARGS+=(--port "$INPUT_PORT")
        fi
        if [ -n "$INPUT_TIMEOUT" ]; then
          ARGS+=(--timeout "$INPUT_TIMEOUT")
        fi
        if [ -n "$INPUT_TARGET" ]; then
          ARGS+=(--target "$INPUT_TARGET")
        fi

        pnpm install --dir "$GITHUB_ACTION_PATH" --frozen-lockfile
        pnpm --dir "$GITHUB_ACTION_PATH" run build

        echo "Running ReleaseProof on $INPUT_PATH..."
        EXIT_CODE=0
        node "$GITHUB_ACTION_PATH/apps/cli/dist/index.js" "${ARGS[@]}" || EXIT_CODE=$?

        REPORT_JSON="$INPUT_PATH/.releaseproof/report.json"
        if [ -f "$REPORT_JSON" ]; then
          node "$GITHUB_ACTION_PATH/scripts/write-action-results.mjs" "$REPORT_JSON" || EXIT_CODE=3
        fi

        # The CLI always preserves its documented exit code. The Action's
        # policy is intentionally separate: a blocker and an unavailable
        # capability can be allowed independently while internal errors never
        # become a green step.
        if [ "$EXIT_CODE" -eq 3 ] || \
           { [ "$EXIT_CODE" -eq 1 ] && [ "$INPUT_FAIL_ON_BLOCKER" = "true" ]; } || \
           { [ "$EXIT_CODE" -eq 2 ] && [ "$INPUT_FAIL_ON_INCOMPLETE" = "true" ]; } || \
           [ "$EXIT_CODE" -eq 130 ]; then
          exit $EXIT_CODE
        fi
