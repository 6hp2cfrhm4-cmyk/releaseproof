name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: python -m pip install fastapi uvicorn

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers (Linux)
        if: runner.os == 'Linux'
        run: pnpm --filter @releaseproof/browser exec playwright install --with-deps chromium

      - name: Install Playwright Browsers (Windows & macOS)
        if: runner.os != 'Linux'
        run: pnpm --filter @releaseproof/browser exec playwright install chromium

      - name: Build All Packages & Bundled CLI
        run: pnpm run build

      - name: Typecheck Workspace
        run: pnpm run lint

      - name: Run Unit & Hardening Tests
        run: pnpm run test

      - name: Cross-platform benchmark smoke
        env:
          RELEASEPROOF_BENCH_MODE: FAST
          RELEASEPROOF_BENCH_FIXTURES: express-working,express-production-crash,nc-api-400-invalid-input,fastapi-working
        run: pnpm run bench

      - name: Run Authoritative Benchmark Suite (Primary Matrix)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20.x'
        env:
          RELEASEPROOF_BENCH_MODE: AUTHORITATIVE
        run: pnpm run bench

      - name: Dogfood Verification (ReleaseProof on Monorepo)
        shell: bash
        run: |
          set +e
          pnpm run proof
          status=$?
          # The repository root is intentionally a monorepo without one
          # runnable application target. INCOMPLETE (exit 2) is expected;
          # verified blockers and internal errors remain CI failures.
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi

  action-e2e:
    name: Composite Action E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: verify
        uses: ./
        with:
          path: fixtures/express-working
          timeout: '10000'
          fail-on-blocker: 'true'
      - name: Validate declared outputs
        shell: bash
        env:
          STATUS: ${{ steps.verify.outputs.status }}
          SCORE: ${{ steps.verify.outputs.score }}
          REPORT: ${{ steps.verify.outputs.html-report }}
        run: |
          test -n "$STATUS"
          test -n "$SCORE"
          test -f "$REPORT"

  tarball-e2e:
    name: Bundled CLI Tarball E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Pack, install, and execute bundled artifact
        shell: bash
        run: |
          TARBALL="$(npm pack ./apps/cli --pack-destination "$RUNNER_TEMP" --silent)"
          npm install --prefix "$RUNNER_TEMP/releaseproof-e2e" --omit=optional --ignore-scripts "$RUNNER_TEMP/$TARBALL"
          CLI="$RUNNER_TEMP/releaseproof-e2e/node_modules/releaseproof/dist/index.js"
          test "$(node "$CLI" --version)" = "0.2.0-dev.0"
          node "$CLI" verify fixtures/express-working --timeout 10000 --json > "$RUNNER_TEMP/tarball-report.json"
          node -e "const r=require(process.argv[1]); if(r.verdict!=='READY') process.exit(1)" "$RUNNER_TEMP/tarball-report.json"
          node scripts/generate-sha256s.mjs "$RUNNER_TEMP/$TARBALL"
          test -s SHA256SUMS.txt

  desktop-build:
    name: Desktop build and Windows installer smoke
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Typecheck Desktop renderer
        run: pnpm --filter @releaseproof/desktop exec tsc -p tsconfig.json --noEmit
      - name: Build NSIS installer
        run: pnpm --filter @releaseproof/desktop run package
      - name: Verify installer artifact and checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/release/ReleaseProof-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          if ($installer.Length -lt 1000000) { throw 'Windows installer is unexpectedly small.' }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content apps/desktop/release/SHA256SUMS.txt
          Get-Content apps/desktop/release/SHA256SUMS.txt
      - name: Upload installer smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: releaseproof-desktop-windows
          path: |
            apps/desktop/release/ReleaseProof-Setup-*.exe
            apps/desktop/release/SHA256SUMS.txt
