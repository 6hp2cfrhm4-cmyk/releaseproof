name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: python -m pip install fastapi uvicorn

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Install Playwright Browsers (Linux)
        if: runner.os == 'Linux'
        run: pnpm --filter @releaseproof/browser exec playwright install --with-deps chromium

      - name: Install Playwright Browsers (Windows & macOS)
        if: runner.os != 'Linux'
        run: pnpm --filter @releaseproof/browser exec playwright install chromium

      - name: Build All Packages & Bundled CLI
        run: pnpm run build

      - name: Typecheck Workspace
        run: pnpm run lint

      - name: Run Unit & Hardening Tests
        run: pnpm run test

      - name: Run 42-Fixture Benchmark Suite (Primary Matrix)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20.x'
        run: pnpm run bench

      - name: Dogfood Verification (ReleaseProof on Monorepo)
        run: pnpm run proof
