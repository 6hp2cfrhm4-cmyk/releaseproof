name: ReleaseProof Action Example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Production Readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run ReleaseProof Action
        uses: 6hp2cfrhm4-cmyk/releaseproof@v0.2.0
        with:
          path: '.'
          fail-on-blocker: 'true'

      - name: Upload ReleaseProof Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: releaseproof-report
          path: .releaseproof/
